name: Deploy to GitHub Pages

permissions:
  contents: read
  pages: write
  id-token: write

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install dependencies
        run: pnpm config set minimum-release-age 0 && pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @workspace/crockies-shop run typecheck

      - name: Build
        run: |
          BASE_PATH="${{ github.event.repository.name }}"
          pnpm --filter @workspace/crockies-shop run build
        working-directory: artifacts/crockies-shop

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Page Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/crockies-shop/dist/public

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v2